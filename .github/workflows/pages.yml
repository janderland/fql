name: Deploy GitHub Pages

# Docs built from main are served at the root of the site.
# Docs built from any other branch are served under a
# subdirectory named after the branch.

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch supersedes an older one.
# Pushes to different branches run concurrently and the
# deploy script retries when they race on gh-pages.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute Docker tag
        id: docker
        run: echo "tag=$(./scripts/docker_tag.sh)" >> $GITHUB_OUTPUT

      - name: Build image (from cache)
        uses: docker/bake-action@v5
        env:
          DOCKER_TAG: ${{ steps.docker.outputs.tag }}
        with:
          files: bake.hcl
          targets: build
          load: true
          set: |
            *.cache-from=type=gha,scope=build-6.2.30
            *.cache-from=type=gha,scope=build-7.1.61

      - name: Generate docs
        run: ./build.sh --docs
        env:
          DOCKER_TAG: ${{ steps.docker.outputs.tag }}

      - name: Deploy docs
        run: ./scripts/deploy_docs.sh "$GITHUB_REF_NAME"
